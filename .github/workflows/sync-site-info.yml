name: 홈페이지 정보 원본 반영

# 관리자 [🏢 홈페이지 정보]에서 바꾼 상호·전화·주소 등을 검색·카카오톡 미리보기·앱 이름(원본 파일)에도 반영
# 이 내용은 GitHub 저장소의 .github/workflows/sync-site-info.yml 에 들어갑니다. (이 파일은 보관용 사본)
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:         # Actions 화면의 [Run workflow] 로 바로 실행

permissions:
  contents: write

concurrency:
  group: sync-site-info
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 설정 읽어서 원본 맞추기
        run: node tools/sync-site-info.mjs
      - name: 바뀐 것이 있으면 저장
        run: |
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "site-info-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "홈페이지 정보 원본 자동 반영"
          git push
